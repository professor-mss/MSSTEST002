ثم الزجر. وهو:
اللَّهُمَّ إِنِّي أَسْأَلُكَ وَلاَ شَيْءَ أَعْظَمُ مِنْكَ إِلَيْكَ، يَا اللهُ يَا اللهُ يَا اللهُ، وَأَسْأَلُكَ يَا اللهُ يَا اللهُ يَا اللهُ، بِالْفَاتِحَةِ، وَبِسِرِّ الْفَاتِحَةِ، وَبِآيَاتِ الْفَاتِحَةِ، وَبِكَلِمَاتِ الْفَاتِحَةِ، وَبِحُرُوفِ الْفَاتِحَةِ، وَبِسِرِّ حُرُوفِهَا، وَبِامْتِزَاجِ بَعْضِهَا بِبَعْضٍ، وَبِآحَادِ أَعْدَادِهَا، وَبِأَعْشَارِ أَعْدَادِهَا، وَبِمِئَاتِ أَعْدَادِهَا، وَبِأُلُوفِ أَعْدَادِهَا، وَبِسَبَبِ إِنْزَالِهَا، وَبِسِرِّ إِنْزَالِهَا، وَبِسِرِّ مَنْ نَزَلَ بِهَا، وَبِسِرِّ مَنْ نَزَلَتْ عَلَيْهِ، سَيِّدِنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَأَسْأَلُكَ اللَّهُمَّ أَنْ تُسَخِّرَ لِي خُدَّامَهَا، وَرُوحَانِيَّتَهَا، يَجْلِبُوا لِي وَلِأَهْلِ دَارِي، وَأَوْلاَدِي، الْمَنَافِعَ وَالأَرْزَاقَ، وَيَدْفَعُوا عَنِّي، وَعَنْ أَهْلِ دَارِي، وَأَوْلاَدِي، وَمَالِي، الأَضْرَارَ، وَالأَشْرَارَ بِسِرِّ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ، وَأَنْ تَحْرُسَنِي وَإِيَّاهُمْ مِمَّا نَخَافُ وَنَحْذَرُ، إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.

مائة وإحدى عشرة مرة. (١١١)

ثم الزجر. وهو:

اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ الْفَاتِحِ لِمَا أُغْلِقَ، وَالْخَاتِمِ لِمَا سَبَقَ، نَاصِرِ الْحَقِّ بِالْحَقِّ، وَالْهَادِي إِلَى صِرَاطِكَ الْمُسْتَقِيمِ، وَعَلَى آلِهِ حَقَّ قَدْرِهِ وَمِقْدَارِهِ الْعَظِيمِ، صَلاَةً تُطْمِسُنَا بِهَا يَا اللهُ فِي حَقِيقَةِ حَضْرَةِ حَقَّ قَدْرِهِ وَمِقْدَارِهِ الْعَظِيمِ، الْهَادِي نَاصِرِ الْحَقِّ بِالْحَقِّ، الْخَالِقِ الْفَعَّالِ لِمَا يُرِيدُ. الْحَضْرَةِ الْمَرْضِيَّةِ الصِّدِّيقِيَّةِ الرَّاضِيَةِ، وَتُرَقِّينَا بِهَا يَا اللهُ إِلَى حَضْرَةِ الْفَاتِحِ الْخَاتِمِ، وَتُطْمِسُنَا فِي مُحَمَّدِيَّتِهَا الأَحْمَدِيَّةِ، حَضْرَةِ الرُّبُوبِيَّةِ، وَالرَّحْمَانِيَّةِ، وَالرَّحِيمِيَّةِ، وَالْمُصَلَّى عَلَيْهَا أَزَلَ الآزَالِ. وَتُرَقِّينَا بِهَا يَا اللهُ إِلَى حَضْرَةِ السِّيَادَةِ الْمُطْلَقَةِ السَّاذِجِيَّةِ، حَضْرَةِ الأُلُوهِيَّةِ، حَضْرَةِ الْوَاحِدِ الأَحَدِ، الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ. سُبْحَانَهُ وَتَعَالَى لَيْسَ كَمِثْلِهِ شَيْءٌ. تَعَالَى عَنْ ذَلِكَ عُلُوًّا كَبِيرًا. سُبْحَانَ اللهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَهَ إِلاَّ اللهُ، وَاللهُ أَكْبَرُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللهِ الْعَلِيِّ الْعَظِيمِ، الْحَيِّ الْقَيُّومِ. أَسْأَلُكَ يَا اللهُ يَا رَبِّ يَا رَحْمَنُ مِنْكَ بِكَ مِنْ فَضْلِكَ الْعَظِيمِ، أَنْ تُعَرِّفَنَا بِحَقَائِقِ هَذِهِ الْحَضَرَاتِ، وَمَعَارِفِهَا، وَنِسَبِهَا، وَحُقُوقِهَا، وَآدَابِهَا، وَمُقْتَضِيَاتِهَا، مَعْرِفَةً ذَوْقِيَّةً، شُهُودِيَّةً، عِيَانِيَّةً، وَأَنْ تُعْطِيَنَا خَيْرَ الدُّنْيَا وَالآخِرَةِ وَخَيْرَ مَا بَيْنَهُمَا، يَا ذَا الْجَلاَلِ وَالإِكْرَامِ، وَصَلَّى اللهُ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ تَسْلِيمًا.

اللَّهُمَّ إِنِّي نَوَيْتُ أَنْ أَتَقَرَّبَ إِلَيْكَ بِتِلاَوَةِ خَمْسِينَ مَرَّةً مِنْ فَاتِحَةِ الْقُدْسِيَّةِ، وَهِيَ بِأَلْفِ مَرَّةٍ فِي مَرْتَبَةِ عَدَدِ جُمَلِهَا الْحِسَابِيَّةِ. تِلاَوَةِ مَرْتَبَةِ الْقُدْسِيَّةِ، وَالتَّجَلِّيَاتِ الذَّرِّيَّةِ اللاَّنِهَائِيَّةِ. تَعَبُّدًا لِلَّهِ تَعَالَى.

بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ (١) الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ (٢) الرَّحْمَنِ الرَّحِيمِ (٣) مَالِكِ يَوْمِ الدِّينِ (٤) إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ (٥) اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ (٦) صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلاَ الضَّالِّينَ (٧) آمِين.

خمسون مرة (٥٠)
أَسْأَلُكَ اللَّهُمَّ بِالْفَاتِحَةِ الْقُدْسِيَّةِ، وَبِسِرِّ الْفَاتِحَةِ الْقُدْسِيَّةِ، وَبِسِرِّ آيَاتِهَا سَبْعُ آيَاتٍ، وَبِكَلِمَاتِهَا أَرْبَعَةٌ وَعِشْرُونَ كَلِمَةً، وَبِحُرُوفِهَا مِائَةٌ وَأَرْبَعَةٌ وَعِشْرُونَ حَرْفًا، وَبِنُقَطِهَا خَمْسِينَ نُقْطَةً، وَبِسِرِّ النُّقْطَتَيْنِ مَعَهَا الْبَاءِ وَالنُّونِ، وَبِسِرِّ النُّقْطَةِ الذَّرِّيَّةِ، وَبِسِرِّ جَمِيعِ مَا نَذْكُرُهُ فِي أَوْرَادِنَا وَأَذْكَارِنَا، أَنْ تُعَجِّلَ قَبُولَ جَمِيعِ دَعَوَاتِنَا. وَأَنْ تُجِيبَ دُعَائَنَا وَمَطَالِبَنَا فِي كُلِّ مَا سَأَلْنَاكَ فِي مَجْمُوعَةِ دَعَوَاتِ الأَعْلَى لِتَعْجِيلِ الإِجَابَةِ وَالتَّحَقُّقِ بِجَمِيعِ مَطَالِبِ دَائِرَةِ الْعَلِيَّةِ الْقُدْسِيَّةِ الذَّرِّيَّةِ، وَالْوَظِيفَةِ الْقُدْسِيَّةِ فِي التَّجَلِّيَاتِ الذَّرِّيَّةِ. عَاجِلاً عَاجِلاً عَاجِلاً. بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ. آمِين.

ثم سر الزيارة.
وهو:
السَّلاَمُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
مائة مرة. (١٠٠)
السَّلاَمُ عَلَيْكَ يَا خَلِيفَةَ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَصَاحِبَهُ، وَوَزِيرَهُ، وَرَفِيقَهُ فِي السَّفَرِ، وَثَانِيَهُ فِي الْغَارِ، يَا سَيِّدَنَا وَمَوْلاَنَا أَبَا بَكْرٍ الصِّدِّيقِ وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكَ يَا خَلِيفَةَ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ وَصَاحِبَهُ وَوَزِيرَهُ، يَا مَنْ أَظْهَرَ اللهُ بِهِ الدِّينَ، وَأَعَزَّ بِهِ الإِسْلاَمَ، وَمَنْ إِذَا رَآهُ الشَّيْطَانُ سَالِكًا فَجًّا سَلَكَ فَجًّا غَيْرَ فَجِّهِ، يَا سَيِّدَنَا وَمَوْلاَنَا عُمَرَ بْنَ الْخَطَّابِ وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكَ يَا خَلِيفَةَ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ وَصَاحِبَهُ وَوَزِيرَهُ، يَا ذَا النُّورَيْنِ، يَا مَنْ تَسْتَحْيِي مِنْهُ مَلاَئِكَةُ الرَّحْمَنِ، يَا سَيِّدَنَا وَمَوْلاَنَا عُثْمَانَ بْنَ عَفَّانَ وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكَ يَا خَلِيفَةَ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ وَصَاحِبَهُ، وَوَزِيرَهُ، وَأَخَاهُ، وَابْنَ عَمِّهِ، وَزَوْجَ ابْنَتِهِ الْبَتُولِ، وَأَبَا السِّبْطَيْنِ، يَا فَحْلَ الْفُحُولِ، وَيَا لَيْثَ الْكَتَائِبِ، وَيَا بَابَ مَدِينَةِ الْعِلْمِ، يَا سَيِّدَنَا وَمَوْلاَنَا عَلِيًّا بْنَ أَبِي طَالِبٍ وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكُمْ يَا كَافَّةَ أَصْحَابِ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ مُهَاجِرِينَ وَأَنْصَارًا وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكُمْ يَا أَهْلَ بَدْرٍ الْكِرَامِ مَلاَئِكَةً وَصِحَابًا وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكُمْ يَا أَهْلَ بَيْتِ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ الطَّاهِرِينَ الْمُطَهَّرِينَ وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكَ يَا شَيْخَنَا وَأُسْتَاذَنَا وَوَسِيلَتَنَا إِلَى رَبِّنَا الْقُطْبَ الْمَكْتُومَ، وَالْخَاتِمَ الْمُحَمَّدِيَّ، يَا سَيِّدَنَا وَمَوْلاَنَا أَحْمَدَ التِّجَانِي وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكَ يَا خَلِيفَةَ الشَّيْخِ الصِّدِّيقِ الأَكْبَرِ مَوْلاَنَا عَلِيًّا حَرَازِمَ، وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكَ يَا خَلِيفَةَ الشَّيْخِ مَوْلاَنَا الشَّيْخِ إِبْرَاهِيمَ إِنْيَاسْ بْنِ عَبْدِ اللهِ، وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكَ يَا خَلِيفَةَ الشَّيْخِ الإِسْلاَمِ وَبَابَ الْمَعْرِفَةِ سَيِّدِي عَلِيٌّ سِيسْ وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكَ يَا خَلِيفَةَ الْمُطْلَقِ وَصَاحِبَ سِرِّ الْفَيْضَةِ، خَاتِمَ الْحَضَرَاتِ وَسَيِّدَ حَضْرَةِ الْقُدْسِيَّةِ، الْمُتَجَلِّي بِجَمِيعِ الذَّرَّاتِ وَالْمُتَصَرِّفِ بِهَا، يَا سَيِّدَنَا وَمَوْلاَنَا الشَّيْخَ عَلِيَّ بْنَ مُحَمَّدٍ بُنْذَا وَرَحْمَةُ اللهِ تَعَالَى وَبَرَكَاتُهُ.
السَّلاَمُ عَلَيْكُمْ يَا كَافَّةَ أَصْحَابِ الشَّيْخِ حَيْثُمَا كُنْتُمْ، مِنْ قَافٍ إِلَى قَافٍ أَحْيَاءً وَأَمْوَاتًا، وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ.
جَازَى اللهُ عَنَّا نَبِيَّنَا وَرَسُولَنَا مُحَمَّدًا صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ أَفْضَلَ مَا هُوَ أَهْلُهُ.
جَازَى اللهُ عَنَّا شَيْخَنَا وَوَسِيلَتَنَا إِلَى رَبِّنَا، الْقُطْبَ الْمَكْتُومَ، وَالْخَاتِمَ الْمُحَمَّدِيَّ، مَوْلاَنَا أَحْمَدَ التِّجَانِي رَضِيَ اللهُ عَنْهُ.
جَازَى اللهُ عَنَّا خَلِيفَةَ الشَّيْخِ الصِّدِّيقِ الأَكْبَرِ مَوْلاَنَا عَلِيًّا حَرَازِمَ رَضِيَ اللهُ عَنْهُ.
جَازَى اللهُ عَنَّا خَلِيفَةَ الشَّيْخِ مَوْلاَنَا الشَّيْخِ إِبْرَاهِيمَ إِنْيَاسْ رَضِيَ اللهُ عَنْهُ.
جَازَى اللهُ عَنَّا خَلِيفَةَ الشَّيْخِ الإِسْلاَمِ، وَبَابَ الْمَعْرِفَةِ، سَيِّدِي عَلِيٌّ سِيسْ، رَضِيَ اللهُ عَنْهُ.
جَازَى اللهُ عَنَّا خَلِيفَةَ الْمُطْلَقِ وَصَاحِبَ سِرِّ الْفَيْضَةِ، خَاتِمَ الْحَضَرَاتِ وَسَيِّدَ حَضْرَةِ الْقُدْسِيَّةِ، الْمُتَجَلِّي بِجَمِيعِ الذَّرَّاتِ وَالْمُتَصَرِّفِ بِهَا، مَوْلاَنَا الشَّيْخَ عَلِيَّ بْنَ مُحَمَّدٍ بُنْذَا قَدَّسَ اللهُ سِرَّهُ.
جَازَى اللهُ عَنَّا جَمِيعَ سَادَاتِنَا الْمُجِيزِينَ لَنَا، وَالْمُفِيدِينَ لَنَا، وَالْمُرْشِدِينَ لَنَا، وَالْمُرَبِّينَ لَنَا، وَالْمُرَقِّينَ لَنَا، عَنْ إِذْنِ سَيِّدِنَا وَمَوْلاَنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ.

مرة واحدة (١) في الصباح والمساء، بعد قراءة الورد اللازم.

];
let size=19;
function render(){document.getElementById('list').innerHTML=topics.map((t,i)=>`<div class="card" onclick="openTopic(${i})"><img src="icon.jpg"><div><b>${t.t}</b><span>${t.sub}</span></div><div class="arrow">›</div></div>`).join('')}
function openTopic(i){document.getElementById('list').style.display='none';document.getElementById('detail').style.display='block';document.getElementById('dTitle').innerText=topics[i].t;document.getElementById('dContent').innerText=topics[i].c;window.scrollTo(0,0)}
function goHome(){document.getElementById('detail').style.display='none';document.getElementById('list').style.display='flex';window.scrollTo(0,0)}
function changeSize(d){size+=d;document.getElementById('dContent').style.fontSize=size+'px'}
render();
setTimeout(()=>{document.getElementById('splash').style.display='none'},2000);
